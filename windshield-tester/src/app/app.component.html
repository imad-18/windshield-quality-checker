<div class="app-container">

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="header-left">
            <img src="saint-gobain-logo.jpg" alt="Logo" class="brand-logo" />
        </div>
        <div class="header-center">
            <h1 class="app-title">{{ 'app.title' | translate }} {{ selectedModel }}</h1>
            <p class="app-subtitle">{{ 'app.subtitle' | translate }}</p>
        </div>
        <div class="header-right">
            <!-- Language Selector -->
            <button mat-icon-button [matMenuTriggerFor]="langMenu" class="toolbar-btn" [matTooltip]="'Language'">
                <span class="flag-icon">{{ currentFlag }}</span>
            </button>
            <mat-menu #langMenu="matMenu">
                <button mat-menu-item *ngFor="let lang of languages" (click)="setLanguage(lang.code)">
                    <span class="flag-icon">{{ lang.flag }}</span>&nbsp; {{ lang.label }}
                </button>
            </mat-menu>

            <!-- Theme Toggle -->
            <button mat-icon-button class="toolbar-btn theme-toggle" (click)="theme.toggle()"
                [matTooltip]="'theme.toggle' | translate">
                <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
            </button>
        </div>
    </header>
    
    <router-outlet></router-outlet>
</div>
