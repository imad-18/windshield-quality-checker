name: postglass # ---Rename the project

services:
  mysql:
    image: mysql:8.0
    container_name: windshield-mysql
    environment:
      MYSQL_ROOT_PASSWORD: imad0003
      MYSQL_DATABASE: windshield_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init-db:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - windshield-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin
    container_name: windshield-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: imad0003
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - windshield-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend # <--- ADDED: This forces the image name to be just "backend"
    container_name: windshield-backend
    volumes:
      # BIND MOUNT : lie le dossier backend local au conteneur
      - ./backend:/app
      # devices:
      # ACCÈS HARDWARE : adapte ceci selon que l'ordinateur industriel est sous Linux ou Windows
      # - "/dev/ttyUSB0:/dev/ttyUSB0" 
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:imad0003@mysql:3306/windshield_db
      # Remplacez par vos vraies valeurs de base de données en production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - windshield-network
    restart: unless-stopped

  frontend:
    build:
      context: ./windshield-tester
      dockerfile: Dockerfile
    image: frontend # <--- ADDED: This forces the image name to be just "frontend"
    container_name: windshield-frontend
    volumes:
      - ./windshield-tester:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    environment:
      - ANGULAR_PORT=4200
      - BACKEND_API_URL=http://backend:8000
    networks:
      - windshield-network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  windshield-network:
    driver: bridge
